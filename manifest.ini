name = quickUISearch
summary = "Quick UI Search"
description = """TalkBack-style screen search: press NVDA+J, type part of a control's name, and jump straight to it. Searches only what is visible in the current window, or only the open dialog or menu."""
author = "Mohd Farhan Hussain"
url = https://github.com/mohd-farhan-developer/quickUISearch.nvda-addon
version = 1.1
minimumNVDAVersion = 2023.1
lastTestedNVDAVersion = 2025.3.2
changelog = """* Searches the whole visible window, or only the open dialog or menu.
* Scans in small steps on NVDA's main thread, so NVDA keeps speaking and never freezes, even with very long lists.
* In browse mode the cursor moves to the chosen control; controls that cannot take focus are read with the review cursor.
* Finds all controls in long lists, such as Discord's voice panel, channel list and chat.
* The dialog closes by itself if you switch to another window.
* Cleaner results: no repeated text, no link addresses, names on one line."""
